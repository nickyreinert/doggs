<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOGGS</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;font:14px system-ui,sans-serif;color:#1d2936;background:#f3f5f7;display:flex;flex-direction:column}header,.preview-head,footer{background:#fff}header{padding:14px 18px;border-bottom:1px solid #dbe1e8}.brand{font-size:19px;font-weight:750;margin-bottom:12px}.brand span{font-size:12px;font-weight:400;color:#68788b;margin-left:8px}.topbar{display:grid;grid-template-columns:190px 1fr 300px;gap:12px}.panel{border:1px solid #dbe1e8;border-radius:9px;padding:9px;min-height:100px}.panel h2,.editor label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#68788b;margin:0 0 7px;display:block}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;border:1px solid #cbd4df;border-radius:6px;padding:7px;background:#fff}select{min-height:60px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip,.action,.dupes{border:1px solid #ccd5df;border-radius:99px;background:#f7f9fb;padding:4px 8px;color:#33475b;cursor:pointer}.chip.selected,.dupes.selected{color:#fff;background:#2463a0;border-color:#2463a0}.dupes{margin-top:8px;font-size:12px}.count{opacity:.65;margin-left:4px}main{display:grid;grid-template-columns:390px 1fr;flex:1;min-height:0}aside{overflow:auto;padding:12px;background:#fff;border-right:1px solid #dbe1e8}.year-group{margin-bottom:15px}.year-group h3{font-size:13px;color:#405166;border-bottom:1px solid #e4e9ee;padding-bottom:5px}.file{font:inherit;text-align:left;width:100%;border:1px solid #e1e6eb;border-radius:8px;background:#fff;padding:9px;margin-bottom:7px;cursor:pointer}.file:hover{background:#f7faff}.file.active{background:#edf6ff;border-color:#2463a0}.title{font-weight:650;word-break:break-word}.meta,.summary{font-size:12px;margin-top:4px}.meta{color:#68788b}.summary{color:#405166;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.duplicate-badge{color:#9b6b16;font-size:11px;margin-left:6px}#preview{display:flex;flex-direction:column;min-width:0;min-height:0}.preview-head{border-bottom:1px solid #dbe1e8;padding:14px 18px 11px;box-shadow:0 1px 2px rgba(28,42,54,.03)}.document-title{font-size:15px;font-weight:720;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.document-meta{font-size:12px;color:#68788b;margin:4px 0 13px}.editor-grid{display:grid;grid-template-columns:minmax(210px,.75fr) minmax(320px,2fr) auto;gap:10px;align-items:end}.editor textarea{height:54px;resize:vertical;line-height:1.35}.editor input,.editor textarea{background:#fbfcfd}.editor-actions{display:flex;gap:7px;align-items:center;padding-bottom:1px}.action{border-radius:6px;white-space:nowrap;padding:8px 10px;font-size:12px;font-weight:600}.action.primary{background:#2463a0;color:#fff;border-color:#2463a0}.action:disabled{opacity:.55;cursor:wait}.editor-status{font-size:12px;color:#68788b;margin-top:7px;min-height:15px}iframe{width:100%;border:0;flex:1;background:#e8edf2}.empty{color:#68788b;padding:12px}footer{flex:none;border-top:1px solid #dbe1e8;color:#68788b;font-size:12px}.footer-bar{height:34px;display:flex;align-items:center;gap:15px;padding:0 14px}.dot{width:8px;height:8px;border-radius:50%;background:#9aa8b7;display:inline-block}.dot.ok{background:#2b8a57}.dot.warn{background:#d2921e}.footer-toggle{margin-left:auto;border:0;background:transparent;color:#405166;cursor:pointer}.pipeline{display:none;border-top:1px solid #e6ebf0;padding:10px 14px;max-height:190px;overflow:auto}.pipeline.open{display:block}.pipeline-head{display:flex;gap:12px;font-weight:600}.scan-button{border:1px solid #ccd5df;border-radius:5px;background:#fff;padding:3px 7px;cursor:pointer}.pipeline-list{margin:7px 0;padding-left:18px}.pipeline-error{color:#a14d34}@media(max-width:1050px){.editor-grid{grid-template-columns:1fr 1.5fr}.editor-actions{grid-column:1/-1}}@media(max-width:900px){body{height:auto;min-height:100vh}.topbar,main{grid-template-columns:1fr}main{grid-template-rows:42vh 58vh}.editor-grid{grid-template-columns:1fr}.editor-actions{grid-column:auto;flex-wrap:wrap}.action{width:max-content}aside{border-right:0;border-bottom:1px solid #dbe1e8}}
.editor input{height:54px}.file-fields{display:grid;grid-template-columns:1fr 92px;gap:8px}.file-fields .filename{grid-column:1/-1}.file-fields input,.file-fields select{height:34px;min-height:34px}.editor-actions{flex-direction:column;align-self:stretch;justify-content:space-between;gap:7px;min-width:176px;padding-bottom:0}.editor-actions .action{width:100%;flex:1}@media(max-width:1050px){.editor-actions{flex-direction:row;min-width:0}.editor-actions .action{width:auto;flex:0 1 auto}}
</style></head><body>
<header><div class="brand">DOGGS <span>local document archive</span></div><div class="topbar"><section class="panel"><h2>Year</h2><select id="years" size="5"></select></section><section class="panel"><h2>Tags</h2><div class="chips" id="tags"></div></section><section class="panel"><h2>Quick search</h2><input id="query" type="search" placeholder="Filename, date, classification…"><button class="dupes" id="duplicates" type="button">Duplicates only <span class="count" id="duplicateCount">0</span></button></section></div></header>
<main><aside id="files"></aside><section id="preview"><div class="preview-head"><div class="document-title" id="documentTitle">Select a document</div><div class="document-meta" id="documentMeta">Its details and preview will appear here.</div><div class="editor-grid"><div class="file-fields"><div class="editor"><label for="tagInput">Custom tags</label><input id="tagInput" placeholder="e.g. career, important"></div><div class="editor"><label for="yearInput">Folder</label><select id="yearInput"></select></div><div class="editor filename"><label for="filenameInput">Filename</label><input id="filenameInput" placeholder="document.pdf"></div></div><div class="editor"><label for="summaryInput">Summary</label><textarea id="summaryInput" placeholder="Add or edit a summary"></textarea></div><div class="editor-actions"><button class="action" id="saveDetails" disabled>Save details</button><button class="action primary" id="fullScan" disabled>Run full OCR &amp; summarize</button></div></div><div class="editor-status" id="editorStatus"></div></div><iframe id="frame" title="PDF preview"></iframe></section></main>
<footer><div class="footer-bar"><span><span class="dot" id="ollamaDot"></span> <span id="ollamaStatus">Checking Ollama…</span></span><span id="modelStatus"></span><button class="scan-button" id="rerunLlm">Rerun LLM</button><button class="footer-toggle" id="pipelineToggle">Pipeline</button></div><div class="pipeline" id="pipeline"><div class="pipeline-head"><span id="pipelineCount">Pipeline</span><button class="scan-button" id="scanNow">Scan now</button><span id="ocrStatus"></span></div><ul class="pipeline-list" id="pipelineList"></ul><div class="pipeline-error" id="pipelineError"></div></div></footer>
<script>
const state={q:'',year:'',tags:new Set(),duplicates:false,selected:null};let files=[],timer,availableYears=[];const $=id=>document.getElementById(id);
async function refresh(){const p=new URLSearchParams();if(state.q)p.set('q',state.q);if(state.year)p.set('years',state.year);if(state.tags.size)p.set('tokens',[...state.tags].join(','));if(state.duplicates)p.set('duplicates','1');const r=await fetch('/api/index?'+p);if(!r.ok)return;const d=await r.json();renderYears(d.years||[]);renderTags(d.tags||[]);$('duplicateCount').textContent=d.duplicates_count||0;renderFiles(d.files||[]);if(state.selected){const updated=d.files.find(f=>f.id===state.selected.id);if(updated)selectFile(updated,false)}}
function renderYears(items){availableYears=items.map(i=>i.value);const e=$('years');e.innerHTML='<option value="">All years</option>';items.forEach(i=>{const o=document.createElement('option');o.value=i.value;o.textContent=`${i.value} (${i.count})`;e.append(o)});e.value=state.year}
function renderTags(items){const e=$('tags'),known=new Set(items.map(i=>i.value));[...state.tags].filter(x=>!known.has(x)).forEach(value=>items.unshift({value,count:0}));e.innerHTML='';if(!items.length){e.innerHTML='<div class="empty">No tags yet.</div>';return}items.forEach(i=>{const b=document.createElement('button');b.className='chip'+(state.tags.has(i.value)?' selected':'');b.textContent=i.value+' ';const c=document.createElement('span');c.className='count';c.textContent=i.count;b.append(c);b.onclick=()=>{state.tags.has(i.value)?state.tags.delete(i.value):state.tags.add(i.value);refresh()};e.append(b)})}
function renderFiles(list){files=list;const e=$('files');e.innerHTML='';if(!list.length){e.innerHTML='<div class="empty">No documents found.</div>';return}const groups={};list.forEach(f=>(groups[f.year||'unknown']??=[]).push(f));Object.keys(groups).sort().reverse().forEach(y=>{const g=document.createElement('section');g.className='year-group';g.innerHTML=`<h3>${y}</h3>`;groups[y].forEach(f=>{const b=document.createElement('button');b.className='file'+(state.selected?.id===f.id?' active':'');b.innerHTML='<div class="title"></div><div class="meta"></div><div class="summary"></div>';b.querySelector('.title').textContent=f.name;if(f.is_duplicate)b.querySelector('.title').insertAdjacentHTML('beforeend','<span class="duplicate-badge">duplicate</span>');b.querySelector('.meta').textContent=[f.date||'no date',f.classification||'document'].join(' • ');b.querySelector('.summary').textContent=f.summary||'';b.onclick=()=>selectFile(f);g.append(b)});e.append(g)})}
function selectFile(f,load=true){state.selected=f;$('documentTitle').textContent=f.pdf_title||f.name;$('documentMeta').textContent=[f.name,f.pdf_author,f.date,f.classification,f.is_duplicate?'Duplicate content':''].filter(Boolean).join(' • ');$('tagInput').value=f.tags||'';$('filenameInput').value=f.name;$('summaryInput').value=f.summary||'';const years=[...new Set([...availableYears,f.year])].sort().reverse(),yearInput=$('yearInput');yearInput.innerHTML='';years.forEach(year=>{const o=document.createElement('option');o.value=year;o.textContent=year;yearInput.append(o)});yearInput.value=f.year;yearInput.disabled=!!f.is_duplicate;$('saveDetails').disabled=false;$('fullScan').disabled=false;$('editorStatus').textContent=f.full_scan?.state==='running'?'Full OCR scan is running…':f.full_scan?.state==='error'?f.full_scan.error:'';if(load)$('frame').src=f.url;renderFiles(files)}
async function saveDetails(){if(!state.selected)return;const b=$('saveDetails');b.disabled=true;const r=await fetch('/api/file/'+encodeURIComponent(state.selected.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags:$('tagInput').value,summary:$('summaryInput').value,year:$('yearInput').value,filename:$('filenameInput').value})});b.disabled=false;if(r.ok){$('editorStatus').textContent='Saved.';await refresh()}else $('editorStatus').textContent='Could not save details.'}
async function fullScan(){if(!state.selected)return;const b=$('fullScan');b.disabled=true;const r=await fetch('/api/file/'+encodeURIComponent(state.selected.id)+'/full-scan',{method:'POST'});$('editorStatus').textContent=r.ok?'Full OCR scan started. This can take a while.':'Could not start the full scan.';setTimeout(()=>{b.disabled=false;refresh()},1000)}
async function refreshStatus(){try{const s=await (await fetch('/api/status')).json(),p=s.pipeline;$('ollamaDot').className='dot '+(s.ollama_connected?'ok':'warn');$('ollamaStatus').textContent=s.ollama_connected?'Ollama connected':s.error||'Ollama unavailable';$('modelStatus').textContent=`Model: ${s.model}${s.ollama_connected?(s.model_available?' · available':' · not pulled'):''}`;$('pipelineCount').textContent=`Pipeline · ${p.waiting_count} waiting${p.processing?' · processing '+p.processing:''}`;$('ocrStatus').textContent=`OCR ${s.ocr_language}: ${s.ocr_available?'available':'missing'}`;const e=$('pipelineList');e.innerHTML='';if(!p.waiting.length)e.innerHTML='<li>No PDFs waiting in the inbox.</li>';p.waiting.forEach(x=>{const li=document.createElement('li');li.textContent=`${x.name} · ${Math.ceil(x.size/1024)} KB · ${x.state}`;e.append(li)});$('pipelineError').textContent=p.last_error||''}catch{ $('ollamaStatus').textContent='Status unavailable'}}
$('years').onchange=e=>{state.year=e.target.value;refresh()};$('query').oninput=e=>{state.q=e.target.value.trim();clearTimeout(timer);timer=setTimeout(refresh,250)};$('duplicates').onclick=()=>{state.duplicates=!state.duplicates;$('duplicates').classList.toggle('selected',state.duplicates);refresh()};$('saveDetails').onclick=saveDetails;$('fullScan').onclick=fullScan;$('pipelineToggle').onclick=()=>{$('pipeline').classList.toggle('open')};$('scanNow').onclick=async()=>{await fetch('/api/scan',{method:'POST'});setTimeout(()=>{refresh();refreshStatus()},700)};$('rerunLlm').onclick=async()=>{const b=$('rerunLlm');if(!files.length)return;b.disabled=true;b.textContent='Rerunning…';const r=await fetch('/api/rerun-llm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:files.map(f=>f.id)})});if(!r.ok)alert('Could not start the LLM rerun.');setTimeout(()=>{b.disabled=false;b.textContent='Rerun LLM';refresh();refreshStatus()},1000)};refresh();refreshStatus();setInterval(()=>{refreshStatus();refresh()},15000);
</script></body></html>
