<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOGGS</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='51' font-size='36'%3E🐶🐶%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px system-ui;color:#1d2936;background:#f3f5f7;display:flex;flex-direction:column}header,.preview-head,footer,dialog{background:#fff}header{padding:14px 18px;border-bottom:1px solid #dbe1e8}.brand{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:19px;font-weight:750}.brand-logo{font-size:23px;letter-spacing:-5px}.brand-subtitle,.meta,.document-meta,.editor-status{color:#68788b}.brand-subtitle{font-size:12px;font-weight:400}.topbar{display:grid;grid-template-columns:190px 1fr 300px;gap:12px}.panel{min-height:100px;padding:9px;border:1px solid #dbe1e8;border-radius:9px}.panel h2,.editor label,.inferred-label{display:block;margin:0 0 7px;color:#68788b;font-size:11px;letter-spacing:.08em;text-transform:uppercase}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:7px;border:1px solid #cbd4df;border-radius:6px;background:#fff}select{min-height:60px}.chips,.document-tags{display:flex;flex-wrap:wrap;gap:5px}.chip,.tag-chip,.action,.dupes,.icon-button{border:1px solid #ccd5df;background:#f7f9fb;color:#33475b;cursor:pointer}.chip,.dupes{padding:4px 8px;border-radius:99px}.chip.selected,.dupes.selected,.action.primary{border-color:#2463a0;background:#2463a0;color:#fff}.count{margin-left:4px;opacity:.65}main{display:grid;grid-template-columns:390px 1fr;flex:1;min-height:0}aside{overflow:auto;padding:12px;background:#fff;border-right:1px solid #dbe1e8}.year-group{margin-bottom:15px}.year-group h3{padding-bottom:5px;border-bottom:1px solid #e4e9ee;color:#405166;font-size:13px}.file{width:100%;margin-bottom:7px;padding:9px;border:1px solid #e1e6eb;border-radius:8px;background:#fff;font:inherit;text-align:left;cursor:pointer}.file:hover{background:#f7faff}.file.active{border-color:#2463a0;background:#edf6ff}.title{font-weight:650;word-break:break-word}.meta,.summary{margin-top:4px;font-size:12px}.summary{color:#405166;display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}.duplicate-badge{margin-left:6px;color:#9b6b16;font-size:11px}#preview{display:flex;min-width:0;min-height:0;flex-direction:column}.preview-head{padding:14px 18px 11px;border-bottom:1px solid #dbe1e8}.document-title{overflow:hidden;font-size:15px;font-weight:720;text-overflow:ellipsis;white-space:nowrap}.document-meta{margin:4px 0 13px;font-size:12px}.editor-grid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(300px,1.35fr) 176px;gap:10px;align-items:end}.file-fields{display:grid;grid-template-columns:1fr 92px;gap:8px}.file-fields .filename{grid-column:1/-1}.file-fields input,.file-fields select{min-height:34px;height:34px}.editor textarea{height:96px;resize:vertical;background:#fbfcfd}.tag-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 5px 3px 8px;border-radius:99px;background:#edf6ff}.tag-chip button{width:18px;height:18px;padding:0;border:0;border-radius:50%;background:#c8def1;color:#174b78;font-weight:700;cursor:pointer}.inferred-tags{margin-top:10px}.editor-actions{display:flex;align-self:stretch;flex-direction:column;justify-content:space-between;gap:7px}.action{width:100%;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600}.action:disabled{opacity:.55;cursor:wait}.editor-status{min-height:15px;margin-top:7px;font-size:12px}iframe{flex:1;width:100%;border:0;background:#e8edf2}.empty{padding:12px;color:#68788b}footer{flex:none;border-top:1px solid #dbe1e8;color:#68788b;font-size:12px}.footer-bar{display:flex;align-items:center;gap:12px;height:38px;padding:0 14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa8b7}.dot.ok{background:#2b8a57}.dot.warn{background:#d2921e}.scan-button,.footer-toggle,.icon-button{padding:4px 8px;border:1px solid #ccd5df;border-radius:5px;background:#fff;cursor:pointer}.footer-toggle{margin-left:auto;border:0;background:transparent;color:#405166}.icon-button{font-size:16px} .pipeline{display:none;max-height:190px;overflow:auto;padding:10px 14px;border-top:1px solid #e6ebf0}.pipeline.open{display:block}.pipeline-head{display:flex;align-items:center;gap:8px;font-weight:600}.pipeline-list{margin:7px 0;padding-left:18px}.pipeline-error{color:#a14d34}dialog{width:min(560px,calc(100vw - 32px));border:1px solid #ccd5df;border-radius:10px;box-shadow:0 18px 70px #0004}dialog::backdrop{background:#14202b59}dialog h2{margin:0 0 6px}dialog p{margin:0 0 12px;color:#68788b}dialog textarea{min-height:120px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.modal-actions button{width:auto}@media(max-width:1050px){.editor-grid{grid-template-columns:1fr 1.4fr}.editor-actions{grid-column:1/-1;flex-direction:row}.editor-actions .action{width:auto}}@media(max-width:900px){.topbar,main,.editor-grid{grid-template-columns:1fr}main{grid-template-rows:42vh 58vh}.editor-actions{grid-column:auto;flex-wrap:wrap}aside{border-right:0;border-bottom:1px solid #dbe1e8}}
</style></head><body>
<header><div class="brand"><span class="brand-logo">🐶🐶</span><span>DOGGS</span><span class="brand-subtitle">local document archive</span></div><div class="topbar"><section class="panel"><h2>Year</h2><select id="years" size="5"></select></section><section class="panel"><h2>Tags</h2><div class="chips" id="tags"></div></section><section class="panel"><h2>Quick search</h2><input id="query" type="search" placeholder="Filename, date, classification…"><button class="dupes" id="duplicates">Duplicates only <span class="count" id="duplicateCount">0</span></button></section></div></header>
<main><aside id="files"></aside><section id="preview"><div class="preview-head"><div class="document-title" id="documentTitle">Select a document</div><div class="document-meta" id="documentMeta">Its details and preview will appear here.</div><div id="detailsEditor" hidden><div class="editor-grid"><div class="file-fields"><div class="editor"><label>Custom tags</label><input id="tagInput" placeholder="e.g. important, tax"></div><div class="editor"><label>Folder</label><select id="yearInput"></select></div><div class="editor filename"><label>Filename</label><input id="filenameInput"></div></div><div class="editor"><label>Summary</label><textarea id="summaryInput"></textarea></div><div class="editor-actions"><button class="action" id="saveDetails">Save details</button><button class="action primary" id="fullScan">Run full OCR &amp; summarize</button></div></div><div class="inferred-tags"><span class="inferred-label">Document tags</span><div class="document-tags" id="documentTags"></div></div><div class="editor-status" id="editorStatus"></div></div></div><iframe id="frame" title="PDF preview"></iframe></section></main>
<footer><div class="footer-bar"><span><span class="dot" id="ollamaDot"></span> <span id="ollamaStatus">Checking Ollama…</span></span><span id="modelStatus"></span><button class="scan-button" id="rerunLlm">Rerun LLM</button><button class="icon-button" id="settingsButton" title="Tag settings">⚙</button><button class="footer-toggle" id="pipelineToggle">Pipeline</button></div><div class="pipeline" id="pipeline"><div class="pipeline-head"><span id="pipelineCount">Pipeline</span><button class="scan-button" id="scanNow">Scan now</button><button class="scan-button" id="pausePipeline">Pause pipeline</button><span id="ocrStatus"></span></div><ul class="pipeline-list" id="pipelineList"></ul><div class="pipeline-error" id="pipelineError"></div></div></footer>
<dialog id="settingsDialog"><form method="dialog"><h2>Tag settings</h2><p>Ignored document tags are hidden from tag lists and document headers. Custom tags are never removed.</p><label class="editor">Ignored tags</label><textarea id="ignoredTags" placeholder="fpdf, printer"></textarea><div class="modal-actions"><button class="action">Cancel</button><button class="action primary" id="saveSettings">Save settings</button></div></form></dialog>
<script>
const state={q:'',year:'',tags:new Set(),duplicates:false,selected:null};let files=[],timer,availableYears=[];const $=id=>document.getElementById(id);
async function refresh(){const p=new URLSearchParams();if(state.q)p.set('q',state.q);if(state.year)p.set('years',state.year);if(state.tags.size)p.set('tokens',[...state.tags].join(','));if(state.duplicates)p.set('duplicates','1');const r=await fetch('/api/index?'+p);if(!r.ok)return;const d=await r.json();availableYears=(d.years||[]).map(i=>i.value);$('years').innerHTML='<option value="">All years</option>'+(d.years||[]).map(i=>'<option value="'+i.value+'">'+i.value+' ('+i.count+')</option>').join('');$('years').value=state.year;renderTags(d.tags||[]);$('duplicateCount').textContent=d.duplicates_count||0;renderFiles(d.files||[]);if(state.selected){const f=files.find(x=>x.id===state.selected.id);f?selectFile(f,false):clearSelection()}}
function renderTags(items){const e=$('tags');e.innerHTML='';items.forEach(i=>{const b=document.createElement('button');b.className='chip'+(state.tags.has(i.value)?' selected':'');b.textContent=i.value+' ('+i.count+')';b.onclick=()=>{state.tags.has(i.value)?state.tags.delete(i.value):state.tags.add(i.value);refresh()};e.append(b)});if(!items.length)e.innerHTML='<div class="empty">No tags yet.</div>'}
function renderFiles(list){files=list;const e=$('files');e.innerHTML='';if(!list.length){e.innerHTML='<div class="empty">No documents found.</div>';return}const groups={};list.forEach(f=>(groups[f.year||'unknown']??=[]).push(f));Object.keys(groups).sort().reverse().forEach(y=>{const g=document.createElement('section');g.className='year-group';g.innerHTML='<h3>'+y+'</h3>';groups[y].forEach(f=>{const b=document.createElement('button');b.className='file'+(state.selected?.id===f.id?' active':'');b.innerHTML='<div class="title"></div><div class="meta"></div><div class="summary"></div>';b.querySelector('.title').textContent=f.name;b.querySelector('.meta').textContent=[f.date||'no date',f.classification||'document',f.is_duplicate?'duplicate':''].filter(Boolean).join(' • ');b.querySelector('.summary').textContent=f.summary||'';b.onclick=()=>selectFile(f);g.append(b)});e.append(g)})}
function clearSelection(){state.selected=null;$('detailsEditor').hidden=true;$('documentTitle').textContent='Select a document';$('documentMeta').textContent='Its details and preview will appear here.';$('frame').removeAttribute('src');renderFiles(files)}
function renderDocumentTags(tags){const e=$('documentTags');e.innerHTML='';if(!tags.length){e.innerHTML='<span class="meta">No inferred tags yet. Use Rerun LLM to improve older documents.</span>';return}tags.forEach(tag=>{const c=document.createElement('span');c.className='tag-chip';c.append(tag);const b=document.createElement('button');b.textContent='−';b.title='Ignore '+tag+' everywhere';b.onclick=()=>ignoreTag(tag);c.append(b);e.append(c)})}
function selectFile(f,load=true){state.selected=f;$('detailsEditor').hidden=false;$('documentTitle').textContent=f.pdf_title||f.name;$('documentMeta').textContent=[f.name,f.pdf_author,f.date,f.classification,f.is_duplicate?'Duplicate content':''].filter(Boolean).join(' • ');$('tagInput').value=f.tags||'';$('filenameInput').value=f.name;$('summaryInput').value=f.summary||'';const ys=[...new Set([...availableYears,f.year])].sort().reverse();$('yearInput').innerHTML=ys.map(y=>'<option value="'+y+'">'+y+'</option>').join('');$('yearInput').value=f.year;$('yearInput').disabled=!!f.is_duplicate;renderDocumentTags(f.inferred_tags||[]);if(load)$('frame').src=f.url;renderFiles(files)}
async function saveDetails(){if(!state.selected)return;const r=await fetch('/api/file/'+encodeURIComponent(state.selected.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags:$('tagInput').value,summary:$('summaryInput').value,year:$('yearInput').value,filename:$('filenameInput').value})});$('editorStatus').textContent=r.ok?'Saved.':'Could not save details.';if(r.ok)refresh()}
async function fullScan(){if(!state.selected)return;const r=await fetch('/api/file/'+encodeURIComponent(state.selected.id)+'/full-scan',{method:'POST'});$('editorStatus').textContent=r.ok?'Full OCR scan started.':'Could not start the full scan.'}
async function ignoreTag(tag){await fetch('/api/tags/'+encodeURIComponent(tag)+'/ignore',{method:'POST'});$('editorStatus').textContent='Tag ignored everywhere.';refresh()}
async function refreshStatus(){try{const s=await (await fetch('/api/status')).json(),p=s.pipeline;$('ollamaDot').className='dot '+(s.ollama_connected?'ok':'warn');$('ollamaStatus').textContent=s.ollama_connected?'Ollama connected':s.error||'Ollama unavailable';$('modelStatus').textContent='Model: '+s.model;$('pipelineCount').textContent='Pipeline · '+p.waiting_count+' waiting'+(p.paused?' · paused':'')+(p.processing?' · processing '+p.processing:'');$('pausePipeline').textContent=p.paused?'Resume pipeline':'Pause pipeline';$('ocrStatus').textContent='OCR '+s.ocr_language+': '+(s.ocr_available?'available':'missing');$('pipelineList').innerHTML=p.waiting.length?p.waiting.map(x=>'<li>'+x.name+' · '+Math.ceil(x.size/1024)+' KB · '+x.state+'</li>').join(''):'<li>No PDFs waiting in the inbox.</li>';$('pipelineError').textContent=p.last_error||''}catch{$('ollamaStatus').textContent='Status unavailable'}}
$('years').onchange=e=>{state.year=e.target.value;refresh()};$('query').oninput=e=>{state.q=e.target.value.trim();clearTimeout(timer);timer=setTimeout(refresh,250)};$('duplicates').onclick=()=>{state.duplicates=!state.duplicates;$('duplicates').classList.toggle('selected',state.duplicates);refresh()};$('saveDetails').onclick=saveDetails;$('fullScan').onclick=fullScan;$('pipelineToggle').onclick=()=>$('pipeline').classList.toggle('open');$('scanNow').onclick=async()=>{await fetch('/api/scan',{method:'POST'});setTimeout(()=>{refresh();refreshStatus()},700)};$('pausePipeline').onclick=async()=>{await fetch('/api/pipeline/pause',{method:'POST'});refreshStatus()};$('rerunLlm').onclick=async()=>{if(!files.length)return;await fetch('/api/rerun-llm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:files.map(f=>f.id)})});refreshStatus()};$('settingsButton').onclick=async()=>{const s=await (await fetch('/api/settings')).json();$('ignoredTags').value=s.ignored_tags.join(', ');$('settingsDialog').showModal()};$('saveSettings').onclick=async e=>{e.preventDefault();const ignored_tags=$('ignoredTags').value.split(/[\s,]+/).filter(Boolean);const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ignored_tags})});if(r.ok){$('settingsDialog').close();refresh()}};refresh();refreshStatus();setInterval(()=>{refresh();refreshStatus()},15000);
</script></body></html>
