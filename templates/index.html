<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOGGS</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;color:#1c2431;background:#f3f5f7;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column}header{padding:14px 18px 16px;background:#fff;border-bottom:1px solid #dbe1e8}.brand{font-size:19px;font-weight:750;letter-spacing:.04em;margin:0 0 12px}.brand span{color:#617184;font-size:12px;font-weight:500;letter-spacing:0;margin-left:8px}.topbar{display:grid;grid-template-columns:190px minmax(300px,1fr) 280px;gap:12px}.panel{border:1px solid #dbe1e8;border-radius:10px;padding:9px;background:#fff;min-height:102px;overflow:auto}.panel h2{font-size:11px;color:#617184;text-transform:uppercase;letter-spacing:.08em;margin:0 0 7px}select,input{font:inherit;width:100%;border:1px solid #cbd4df;border-radius:7px;background:#fff;padding:7px}select{min-height:62px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #ccd5df;background:#f7f9fb;border-radius:100px;padding:4px 8px;color:#273445;cursor:pointer}.chip.selected{color:#fff;border-color:#2463a0;background:#2463a0}.count{opacity:.68;margin-left:4px}main{display:grid;grid-template-columns:390px 1fr;flex:1;min-height:0}aside{padding:12px;overflow:auto;background:#fff;border-right:1px solid #dbe1e8}.year-group{margin-bottom:15px}.year-group h3{font-size:13px;margin:0 0 7px;color:#405166;border-bottom:1px solid #e4e9ee;padding-bottom:5px}.file{font:inherit;text-align:left;width:100%;cursor:pointer;border:1px solid #e1e6eb;border-radius:8px;background:#fff;padding:9px;margin:0 0 7px}.file:hover{background:#f7faff}.file.active{border-color:#2463a0;background:#edf6ff}.title{font-weight:650;word-break:break-word}.meta,.summary{font-size:12px;margin-top:4px}.meta{color:#68788b}.summary{color:#405166;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#preview{display:flex;flex-direction:column;min-width:0;min-height:0}.preview-meta{min-height:43px;padding:11px 14px;background:#fff;border-bottom:1px solid #dbe1e8;color:#405166;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}iframe{border:0;flex:1;width:100%;background:#e8edf2}.empty{padding:12px;color:#68788b}footer{flex:none;background:#fff;border-top:1px solid #dbe1e8;color:#617184;font-size:12px}.footer-bar{height:34px;display:flex;align-items:center;gap:17px;padding:0 14px}.footer-toggle,.scan-button{font:inherit;font-size:12px;color:#405166;background:transparent;border:0;cursor:pointer;padding:4px 0}.footer-toggle{margin-left:auto}.scan-button{border:1px solid #ccd5df;border-radius:5px;padding:3px 7px}.status{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#9aa8b7}.dot.ok{background:#2b8a57}.dot.warn{background:#d2921e}.status-detail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pipeline{display:none;border-top:1px solid #e6ebf0;padding:10px 14px;max-height:210px;overflow:auto;background:#fafbfd}.pipeline.open{display:block}.pipeline-head{display:flex;gap:12px;align-items:center;margin-bottom:7px;font-weight:600;color:#405166}.pipeline-list{margin:0;padding-left:19px;color:#617184}.pipeline-list li{padding:2px 0}.pipeline-error{margin-top:7px;color:#a14d34}@media(max-width:900px){body{height:auto;min-height:100vh}.topbar,main{grid-template-columns:1fr}main{grid-template-rows:42vh 58vh}aside{border-right:0;border-bottom:1px solid #dbe1e8}}
</style></head><body>
<header><div class="brand">DOGGS <span>local document archive</span></div><div class="topbar"><section class="panel"><h2>Year</h2><select id="years" size="5" aria-label="Year filter"></select></section><section class="panel"><h2>Slug tokens</h2><div class="chips" id="tokens"></div></section><section class="panel"><h2>Quick search</h2><input id="query" type="search" placeholder="Filename, date, classification…" autocomplete="off"></section></div></header>
<main><aside id="files"></aside><section id="preview"><div class="preview-meta" id="previewMeta">Select a document to preview it.</div><iframe id="frame" title="PDF preview"></iframe></section></main>
<footer><div class="footer-bar"><span class="status"><span class="dot" id="ollamaDot"></span><span id="ollamaStatus">Checking Ollama…</span></span><span class="status-detail" id="modelStatus"></span><button class="footer-toggle" id="pipelineToggle" type="button">Pipeline</button></div><div class="pipeline" id="pipeline"><div class="pipeline-head"><span id="pipelineCount">Pipeline</span><button class="scan-button" id="scanNow" type="button">Scan now</button><span id="ocrStatus"></span></div><ul class="pipeline-list" id="pipelineList"></ul><div class="pipeline-error" id="pipelineError"></div></div></footer>
<script>
const state={q:'',year:'',tokens:new Set(),selected:null};let files=[],timer;const $=id=>document.getElementById(id);
async function refresh(){const p=new URLSearchParams();if(state.q)p.set('q',state.q);if(state.year)p.set('years',state.year);if(state.tokens.size)p.set('tokens',[...state.tokens].join(','));const r=await fetch('/api/index?'+p);if(!r.ok)return;const d=await r.json();renderYears(d.years||[]);renderTokens(d.tokens||[]);renderFiles(d.files||[])}
async function refreshStatus(){try{const r=await fetch('/api/status');if(!r.ok)throw new Error();const s=await r.json(),dot=$('ollamaDot'),p=s.pipeline;dot.className='dot '+(s.ollama_connected?'ok':'warn');$('ollamaStatus').textContent=s.ollama_connected?'Ollama connected':s.error||'Ollama unavailable';$('modelStatus').textContent=`Model: ${s.model}${s.ollama_connected?(s.model_available?' · available':' · not pulled'):''}`;$('pipelineCount').textContent=`Pipeline · ${p.waiting_count} waiting${p.processing?' · processing '+p.processing:''}`;$('ocrStatus').textContent=`OCR ${s.ocr_language}: ${s.ocr_available?'available':'missing'}`;const list=$('pipelineList');list.innerHTML='';if(!p.waiting.length)list.innerHTML='<li>No PDFs waiting in the inbox.</li>';p.waiting.forEach(item=>{const li=document.createElement('li');li.textContent=`${item.name} · ${Math.ceil(item.size/1024)} KB · ${item.state}`;list.append(li)});$('pipelineError').textContent=p.last_error||''}catch{ $('ollamaDot').className='dot warn';$('ollamaStatus').textContent='Status unavailable';$('modelStatus').textContent='' }}
function renderYears(items){const el=$('years');el.innerHTML='<option value="">All years</option>';items.forEach(i=>{const o=document.createElement('option');o.value=i.value;o.textContent=`${i.value} (${i.count})`;el.append(o)});el.value=state.year}
function renderTokens(items){const el=$('tokens'),known=new Set(items.map(i=>i.value));[...state.tokens].filter(x=>!known.has(x)).forEach(value=>items.unshift({value,count:0}));el.innerHTML='';if(!items.length){el.innerHTML='<div class="empty">No slug tokens yet.</div>';return}items.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='chip'+(state.tokens.has(i.value)?' selected':'');b.innerHTML=`${i.value}<span class="count">${i.count}</span>`;b.onclick=()=>{state.tokens.has(i.value)?state.tokens.delete(i.value):state.tokens.add(i.value);refresh()};el.append(b)})}
function renderFiles(list){files=list;const el=$('files');el.innerHTML='';if(!list.length){el.innerHTML='<div class="empty">No documents found.</div>';return}const groups={};list.forEach(f=>(groups[f.year||'unknown']??=[]).push(f));Object.keys(groups).sort().reverse().forEach(year=>{const g=document.createElement('section');g.className='year-group';g.innerHTML=`<h3>${year}</h3>`;groups[year].forEach(f=>{const b=document.createElement('button');b.type='button';b.className='file'+(state.selected?.stored_path===f.stored_path?' active':'');b.innerHTML=`<div class="title"></div><div class="meta"></div><div class="summary"></div>`;b.querySelector('.title').textContent=f.name;b.querySelector('.meta').textContent=[f.date||'no date',f.classification||'document'].join(' • ');b.querySelector('.summary').textContent=f.summary||'';b.onclick=()=>selectFile(f);g.append(b)});el.append(g)})}
function selectFile(file){state.selected=file;$('previewMeta').textContent=[file.name,file.date||'unknown date',file.classification||'document',file.summary||''].filter(Boolean).join(' • ');$('frame').src=file.url;renderFiles(files)}
$('years').onchange=e=>{state.year=e.target.value;refresh()};$('query').oninput=e=>{state.q=e.target.value.trim();clearTimeout(timer);timer=setTimeout(refresh,250)};$('pipelineToggle').onclick=()=>{$('pipeline').classList.toggle('open');$('pipelineToggle').textContent=$('pipeline').classList.contains('open')?'Hide pipeline':'Pipeline'};$('scanNow').onclick=async()=>{const b=$('scanNow');b.disabled=true;b.textContent='Scanning…';await fetch('/api/scan',{method:'POST'});setTimeout(()=>{b.disabled=false;b.textContent='Scan now';refresh();refreshStatus()},700)};refresh();refreshStatus();setInterval(refreshStatus,15000);
</script></body></html>
